# The matter list. A firm's central record, and the one thing a board genuinely
# cannot be: a matter is a *client relationship with a legal question in it*,
# open for months, carrying dozens of cards, a deadline nobody may miss, and a
# conflict position that has to be checked before anyone does anything at all.

title = "Matters"
purpose = """
Every matter this firm has open: whose it is, what kind, what is due, and how \
each one ended. Read it before starting anything for a client — including \
before research — because the conflict position and the engagement scope live \
here and both bound what may be done.\
"""
written_by = "`record_entry` to open or update a matter, `close_entry` when it concludes or is declined"
checks = ["required-field", "known-status", "closed-needs-reason"]

[[field]]
name = "id"
role = "id"
required = true
description = "The matter number, as the firm files it."

[[field]]
name = "matter"
role = "title"
required = true
description = "The client and the question, in one line."

[[field]]
name = "status"
role = "status"
required = true

[[field]]
name = "client"
role = "prose"
required = true
description = "Who the client is — the entity, not the person who called."

[[field]]
name = "kind"
role = "prose"
description = "Transactional, litigation, advisory, regulatory. It decides who leads."

[[field]]
name = "owner"
role = "owner"
description = "The teammate carrying it day to day."

[[field]]
name = "conflicts"
role = "prose"
required = true
description = "The conflict check result and when it was run. `not run` is a legitimate value and blocks everything else."

[[field]]
name = "scope"
role = "prose"
description = "What the firm agreed to do, and — as importantly — what it did not."

[[field]]
name = "next_deadline"
role = "date"
description = "The nearest date that cannot move. Statutory dates are not negotiable and belong here, not in a note."

[[field]]
name = "reason"
role = "prose"
description = "How it ended — concluded, withdrawn, declined. Required when it closes."

[[field]]
name = "refs"
role = "refs"
description = "Documents, filings, and the tasks carrying the work."

[[status]]
name = "intake"
label = "In intake"

[[status]]
name = "open"
aliases = ["on_hold"]

[[status]]
name = "concluded"
closed = true
needs_reason = true

[[status]]
name = "withdrawn"
closed = true
needs_reason = true

[[status]]
name = "declined"
closed = true
needs_reason = true

[[section]]
heading = "Open matters"
blurb = "Live work. Check the nearest deadline before picking anything up."
statuses = ["open"]
order = "recent"

[[section]]
heading = "In intake"
blurb = """
Not yet a matter. Nothing substantive happens on a row here until `conflicts` \
says a check was run and what it found.\
"""
statuses = ["intake"]
order = "recent"

[[section]]
heading = "On hold"
blurb = "Paused, and by whose decision. Each should say what would restart it."
statuses = ["open"]
order = "recent"

[[section]]
heading = "Closed"
blurb = """
Concluded, withdrawn or declined, each with the reason. A declined matter is \
kept deliberately: the reason is usually a conflict, and it is exactly what the \
next intake needs to find.\
"""
statuses = ["concluded", "withdrawn", "declined"]
cap = 20
