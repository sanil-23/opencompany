role = "Inventor"
description = "Propose a different line of attack when the current one stalls."
# Must see what has already been tried and closed, or it re-proposes it — the
# one thing this role exists not to do.
context = ["GOAL.md", "brief.md", "threads.md", "claims.md", "board.md"]

# Visibility/read-record scope (docs/spec/runtime/ledgers.md): this specialist
# manages its own work on the board and sees, but does not redefine, company
# direction. The orchestrator keeps unrestricted access.
ledgers = [
    { name = "tasks", access = "record" },
    { name = "goals", access = "read" },
    { name = "decisions", access = "read" },
    # The global baseline (`globals/ledgers/`). Every teammate may raise a risk
    # and record what it learned — both are worthless if only the orchestrator
    # can write them, because the teammate that hit the thing is the one that
    # knows. `commitments` stays read-only: promising something outward is not a
    # specialist's call to make alone.
    { name = "risks", access = "record" },
    { name = "commitments", access = "read" },
    { name = "learnings", access = "record" },
    # This lab's own axes (`ledgers/`), which carry the investigation.
    { name = "questions", access = "record" },
    { name = "findings", access = "read" },
    { name = "sources", access = "read" },
]

# The role's working rules, checked in beside this file and read at manifest
# load. The `.toml` carries the wiring; `prompts/` carries how the role works.
# A missing path here is a manifest error rather than a skipped entry — a role
# whose prompt was written around a briefing it never received fails silently.
prompt_files = ["prompts/inventor.md"]
